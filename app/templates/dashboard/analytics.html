{% extends "base.html" %}

{% block title %}Analytics - AI Recruitment System{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h2 class="fw-bold"><i class="fa-solid fa-chart-line text-primary me-2"></i> Analytics</h2>
</div>

<div class="row g-4 mb-4 animate-slide-up delay-1">
    <div class="col-md-6">
        <div class="card shadow-sm h-100">
            <div class="card-header bg-white py-3">
                <h5 class="card-title mb-0 fw-bold">Top Skills Distribution</h5>
            </div>
            <div class="card-body">
                <canvas id="skillsChart" height="200"></canvas>
            </div>
        </div>
    </div>
    <div class="col-md-6">
        <div class="card shadow-sm h-100">
            <div class="card-header bg-white py-3">
                <h5 class="card-title mb-0 fw-bold">Monthly Upload Trend</h5>
            </div>
            <div class="card-body">
                <canvas id="trendChart" height="200"></canvas>
            </div>
        </div>
    </div>
</div>

<div class="row g-4 animate-slide-up delay-2">
    <div class="col-md-4">
        <div class="card shadow-sm h-100">
            <div class="card-header bg-white py-3">
                <h5 class="card-title mb-0 fw-bold">Hiring Funnel</h5>
            </div>
            <div class="card-body">
                <canvas id="funnelChart" height="250"></canvas>
            </div>
        </div>
    </div>
    <div class="col-md-8">
        <div class="card shadow-sm h-100">
            <div class="card-header bg-white py-3">
                <h5 class="card-title mb-0 fw-bold">Candidates Per Job Role</h5>
            </div>
            <div class="card-body">
                <canvas id="rolesChart" height="150"></canvas>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    // Theme colors
    const colors = ['#0d6efd', '#198754', '#ffc107', '#dc3545', '#0dcaf0', '#6610f2'];

    Chart.defaults.color = '#94a3b8';
    Chart.defaults.font.family = "'Inter', sans-serif";
    Chart.defaults.scale.grid.color = 'rgba(255, 255, 255, 0.05)';
    Chart.defaults.scale.grid.borderColor = 'rgba(255, 255, 255, 0.05)';
    
    // 1. Skills Distribution (Bar)
    new Chart(document.getElementById('skillsChart').getContext('2d'), {
        type: 'bar',
        data: {
            labels: {{ skills_labels | tojson | safe }},
            datasets: [{
                label: 'Candidate Count',
                data: {{ skills_data | tojson | safe }},
                backgroundColor: colors[0],
                borderRadius: 4
            }]
        }
    });

    // 2. Monthly Trend (Line)
    new Chart(document.getElementById('trendChart').getContext('2d'), {
        type: 'line',
        data: {
            labels: {{ trend_labels | tojson | safe }},
            datasets: [{
                label: 'Resumes Uploaded',
                data: {{ trend_data | tojson | safe }},
                borderColor: colors[1],
                tension: 0.3,
                fill: true,
                backgroundColor: 'rgba(25, 135, 84, 0.1)'
            }]
        }
    });

    // 3. Hiring Funnel (Doughnut as proxy for funnel)
    new Chart(document.getElementById('funnelChart').getContext('2d'), {
        type: 'polarArea',
        data: {
            labels: ['Applied', 'AI Screened', 'Interview', 'Offered'],
            datasets: [{
                data: {{ funnel_data | tojson | safe }},
                backgroundColor: [colors[0], colors[4], colors[2], colors[1]]
            }]
        }
    });

    // 4. Roles (Horizontal Bar)
    new Chart(document.getElementById('rolesChart').getContext('2d'), {
        type: 'bar',
        data: {
            labels: {{ roles_labels | tojson | safe }},
            datasets: [{
                label: 'Applications',
                data: {{ roles_data | tojson | safe }},
                backgroundColor: colors[5],
                borderRadius: 4
            }]
        },
        options: {
            indexAxis: 'y',
        }
    });
</script>
{% endblock %}
