{% extends "base.html" %}

{% block title %}{{ 'Edit' if job else 'Create' }} Job - AI Recruitment System{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="fw-bold"><i class="fa-solid fa-file-signature text-primary me-2"></i> {{ 'Edit' if job else 'Create' }} Job Description</h2>
            <a href="{{ url_for('jobs.list_jobs') }}" class="btn btn-outline-secondary"><i class="fa-solid fa-arrow-left me-1"></i> Back</a>
        </div>
        
        <div class="card shadow-sm">
            <div class="card-body p-4">
                <form method="POST">
                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label for="title" class="form-label fw-bold">Job Title</label>
                            <input type="text" class="form-control" id="title" name="title" required value="{{ job.title if job else '' }}" placeholder="e.g. Senior Software Engineer">
                        </div>
                        <div class="col-md-6">
                            <label for="department" class="form-label fw-bold">Department</label>
                            <input type="text" class="form-control" id="department" name="department" value="{{ job.department if job else '' }}" placeholder="e.g. Engineering">
                        </div>
                    </div>
                    
                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label for="experience_required" class="form-label fw-bold">Experience Required</label>
                            <input type="text" class="form-control" id="experience_required" name="experience_required" value="{{ job.experience_required if job else '' }}" placeholder="e.g. 3-5 years">
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="required_skills" class="form-label fw-bold">Required Skills (Comma separated)</label>
                        <input type="text" class="form-control" id="required_skills" name="required_skills" required value="{{ job.required_skills if job else '' }}" placeholder="Python, Flask, SQL, React">
                    </div>
                    
                    <div class="mb-4">
                        <label for="description" class="form-label fw-bold">Job Description & Responsibilities</label>
                        <textarea class="form-control" id="description" name="description" rows="6" required placeholder="Enter full job description...">{{ job.description if job else '' }}</textarea>
                    </div>
                    
                    <div class="text-end">
                        <button type="submit" class="btn btn-primary px-4 fw-bold"><i class="fa-solid fa-save me-1"></i> {{ 'Update' if job else 'Save' }} Job</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
