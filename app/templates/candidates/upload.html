{% extends "base.html" %}

{% block title %}Upload Resumes - AI Recruitment System{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="fw-bold"><i class="fa-solid fa-cloud-arrow-up text-primary me-2"></i> Upload Resumes</h2>
            <a href="{{ url_for('candidates.list_candidates') }}" class="btn btn-outline-secondary"><i class="fa-solid fa-arrow-left me-1"></i> Back</a>
        </div>
        
        <div class="card shadow-sm">
            <div class="card-body p-4">
                <form method="POST" enctype="multipart/form-data" id="uploadForm">
                    <div class="mb-4">
                        <label for="job_id" class="form-label fw-bold">Target Job Description (Optional for matching)</label>
                        <select class="form-select" id="job_id" name="job_id">
                            <option value="">-- Select a Job to Match --</option>
                            {% for job in jobs %}
                            <option value="{{ job.id }}">{{ job.title }} ({{ job.department }})</option>
                            {% endfor %}
                        </select>
                    </div>
                    
                    <div class="upload-zone mb-4 p-5 text-center border rounded bg-light border-2 border-dashed position-relative">
                        <i class="fa-solid fa-file-pdf fa-4x text-muted mb-3"></i>
                        <h5>Drag & Drop PDF files here</h5>
                        <p class="text-muted mb-3">or</p>
                        <input class="form-control d-none" type="file" id="resumes" name="resumes" multiple accept=".pdf" required>
                        <label for="resumes" class="btn btn-outline-primary fw-bold px-4">Browse Files</label>
                        <div id="fileList" class="mt-3 text-start small"></div>
                    </div>
                    
                    <div class="text-end">
                        <button type="submit" class="btn btn-primary px-4 fw-bold" id="uploadBtn">
                            <i class="fa-solid fa-cogs me-1"></i> Process with AI
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    const fileInput = document.getElementById('resumes');
    const fileList = document.getElementById('fileList');
    const uploadForm = document.getElementById('uploadForm');
    const uploadBtn = document.getElementById('uploadBtn');
    
    fileInput.addEventListener('change', function() {
        fileList.innerHTML = '';
        if (this.files.length > 0) {
            const ul = document.createElement('ul');
            ul.className = 'list-unstyled mb-0';
            for (let i = 0; i < this.files.length; i++) {
                const li = document.createElement('li');
                li.innerHTML = `<i class="fa-solid fa-file-pdf text-danger me-2"></i> ${this.files[i].name}`;
                ul.appendChild(li);
            }
            fileList.appendChild(ul);
        }
    });

    uploadForm.addEventListener('submit', function() {
        uploadBtn.innerHTML = '<span class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span> Processing...';
        uploadBtn.disabled = true;
    });
</script>
<style>
    .border-dashed { border-style: dashed !important; }
    .upload-zone { transition: background-color 0.3s; }
    .upload-zone:hover { background-color: #e9ecef !important; }
</style>
{% endblock %}
